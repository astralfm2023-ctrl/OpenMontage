<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s1-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          font-family: "League Gothic", sans-serif;
        }
        #s1-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 0 72px;
        }
        #s1-tag {
          display: block;
          font-family: "Space Mono", monospace;
          font-size: 30px;
          letter-spacing: 0.3em;
          color: #ff2a2a;
          margin-bottom: 36px;
        }
        #s1-word {
          font-size: 206px;
          line-height: 0.9;
          letter-spacing: 0.01em;
          color: #f2e9e4;
          white-space: nowrap;
        }
        #s1-bar {
          width: 760px;
          height: 14px;
          margin-top: 40px;
          background: #ff2a2a;
          transform-origin: 0 50%;
        }
      </style>

      <div id="s1-root" data-composition-id="s1-malonehouse" data-width="1080" data-height="1920">
        <div id="s1-stage">
          <div id="s1-tag">— 01 —</div>
          <div id="s1-word">MALONEHOUSE</div>
          <div id="s1-bar"></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // kinetic-beat-slam: scale+blur slam, then a baked failing-sign flicker
          tl.fromTo("#s1-tag", { opacity: 0, scaleX: 1.8 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.4);
          tl.fromTo(
            "#s1-word",
            { scale: 1.7, filter: "blur(18px)", opacity: 0 },
            { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "power4.out" },
            0.8,
          );
          tl.fromTo("#s1-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.inOut" }, 1.25);
          [
            [2.2, 0.25], [2.27, 1], [2.36, 0.45], [2.41, 1],
            [3.9, 0.2], [3.96, 1], [4.6, 0.5], [4.64, 1],
          ].forEach(([at, v]) => tl.set("#s1-word", { opacity: v }, at));
          tl.fromTo("#s1-word", { x: 0 }, { x: 10, duration: 0.04, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, 3.9);
          tl.fromTo("#s1-stage", { scale: 1 }, { scale: 1.035, duration: 4.0, ease: "none" }, 1.4);
          tl.to("#s1-stage", { y: -260, opacity: 0, duration: 0.55, ease: "power3.in" }, 5.4);
          window.__timelines["s1-malonehouse"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
