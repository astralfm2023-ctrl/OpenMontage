<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s2-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        #s2-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #s2-x {
          position: relative;
          width: 760px;
          height: 760px;
        }
        #s2-x svg {
          width: 760px;
          height: 760px;
          display: block;
        }
        .s2-xbar {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 600px;
          height: 64px;
          margin-left: -300px;
          margin-top: -32px;
          background: #ff2a2a;
        }
        #s2-tag {
          margin-top: 56px;
          font-family: "Space Mono", monospace;
          font-size: 30px;
          letter-spacing: 0.3em;
          color: #ff2a2a;
        }
      </style>

      <div id="s2-root" data-composition-id="s2-x" data-width="1080" data-height="1920">
        <div id="s2-stage">
          <div id="s2-x">
            <svg viewBox="0 0 760 760" aria-hidden="true">
              <circle
                id="s2-ring"
                cx="380"
                cy="380"
                r="350"
                fill="none"
                stroke="#ff2a2a"
                stroke-width="6"
                transform="rotate(-90 380 380)"
              />
            </svg>
            <div class="s2-xbar" id="s2-bar1"></div>
            <div class="s2-xbar" id="s2-bar2"></div>
          </div>
          <div id="s2-tag">— 02 —</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // svg-path-draw ring → spring-pop-entrance bars → push-through exit
          const RING_LEN = 2 * Math.PI * 350;
          tl.fromTo(
            "#s2-ring",
            { attr: { "stroke-dasharray": RING_LEN, "stroke-dashoffset": RING_LEN } },
            { attr: { "stroke-dasharray": RING_LEN, "stroke-dashoffset": 0 }, duration: 1.3, ease: "power2.inOut" },
            0.15,
          );
          tl.fromTo("#s2-bar1", { rotation: -45, scaleX: 0 }, { rotation: 45, scaleX: 1, duration: 0.6, ease: "back.out(2.2)" }, 0.55);
          tl.fromTo("#s2-bar2", { rotation: 45, scaleX: 0 }, { rotation: -45, scaleX: 1, duration: 0.6, ease: "back.out(2.2)" }, 0.75);
          tl.fromTo("#s2-x", { rotation: -8, scale: 1 }, { rotation: 8, duration: 3.6, ease: "sine.inOut" }, 0.6);
          tl.fromTo("#s2-tag", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);
          tl.to("#s2-x", { scale: 1.07, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 2.6);
          tl.to("#s2-x", { scale: 4.2, opacity: 0, filter: "blur(10px)", duration: 0.6, ease: "power3.in" }, 4.35);
          tl.to("#s2-tag", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.35);
          window.__timelines["s2-x"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
