<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s5-root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          font-family: "League Gothic", sans-serif;
        }
        #s5-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .s5-lock {
          display: block;
          text-align: center;
          white-space: nowrap;
        }
        #s5-a,
        #s5-c {
          font-size: 168px;
          line-height: 0.92;
          color: #f2e9e4;
          letter-spacing: 0.01em;
        }
        #s5-b {
          font-size: 150px;
          line-height: 0.9;
          color: #ff2a2a;
          margin: 4px 0;
        }
        #s5-rule {
          width: 640px;
          height: 10px;
          margin: 56px 0 48px;
          background: #ff2a2a;
        }
        #s5-d {
          font-size: 158px;
          line-height: 0.9;
          color: #ff2a2a;
          letter-spacing: 0.02em;
        }
      </style>

      <div id="s5-root" data-composition-id="s5-lockup" data-width="1080" data-height="1920">
        <div id="s5-stage">
          <div class="s5-lock" id="s5-a">MALONEHOUSE</div>
          <div class="s5-lock" id="s5-b">X</div>
          <div class="s5-lock" id="s5-c">WINKYPINKY</div>
          <div id="s5-rule"></div>
          <div class="s5-lock" id="s5-d">HAPPY HALLOWEEN</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // waterfall-entry stack → ambient hold
          tl.fromTo("#s5-a", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.1);
          tl.fromTo("#s5-b", { scale: 0, opacity: 0, rotation: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.35);
          tl.fromTo("#s5-c", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.55);
          tl.fromTo("#s5-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.inOut" }, 0.95);
          tl.fromTo(
            "#s5-d",
            { opacity: 0, scale: 1.25, filter: "blur(12px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" },
            1.3,
          );
          tl.fromTo("#s5-stage", { scale: 0.98 }, { scale: 1.03, duration: 5.2, ease: "sine.inOut" }, 1.3);
          tl.to("#s5-b", { rotation: 6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 5 }, 2.1);
          window.__timelines["s5-lockup"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
